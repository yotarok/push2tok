[package]
name = "push2tok"
version = "0.1.0"
description = "Streaming byte-to-token transduction with deterministic finite-state transducers"
readme = "README.md"
exclude = ["dist/**", "python/**/__pycache__/**", "**/*.pyc", "python/**/*.so", "python/**/*.pyd", "python/**/*.dylib"]
edition = "2021"
rust-version = "1.83"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39"] }
rustfst = { version = "1.3.1", default-features = false }
