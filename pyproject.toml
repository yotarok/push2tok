[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "push2tok"
version = "0.1.0"
description = "Streaming byte-to-token transduction with deterministic finite-state transducers"
readme = "README.md"
authors = [{ name = "Yotaro KUBO" }]
requires-python = ">=3.9"
dependencies = ["sentencepiece", "protobuf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
push2tok = "push2tok.cli:main"

[project.urls]
Homepage = "https://github.com/yotarok/push2tok"
Repository = "https://github.com/yotarok/push2tok"
Issues = "https://github.com/yotarok/push2tok/issues"

[tool.maturin]
module-name = "push2tok._native"
python-source = "python"
exclude = ["**/__pycache__/**", "**/*.pyc", "dist/**", ".pon*/**", "README.for_agents.md"]

[tool.uv]
# Rebuild the native extension on `uv sync` / `uv run` when Rust sources change.
# (Python sources under python/ are installed editable and need no rebuild.)
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
